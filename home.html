*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
img { display: block; max-width: 100%; }

.mono { font-family: var(--font-mono); font-feature-settings: 'zero', 'ss01'; }
.eyebrow {
  font-size: var(--t-eyebrow);

.eyebrow-accent { color: var(--accent); }
.tracking-tight { letter-spacing: -0.035em; }
.tracking-tighter { letter-spacing: -0.05em; }

/* Animated underline */
.link-underline {
  position: relative;
  display: inline-block;
}
.link-underline::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -2px;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right center;
  transition: transform 0.45s cubic-bezier(.7,0,.2,1);
}
.link-underline:hover::after {
  transform: scaleX(1);
  transform-origin: left center;
}

/* Marquee */
@keyframes marquee-x {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* Caret blink */
@keyframes caret { 50% { opacity: 0; } }
.caret {
  display: inline-block;
  width: 0.45ch;
  background: var(--accent);
  margin-left: 4px;
  animation: caret 1s steps(2, end) infinite;
  vertical-align: -0.08em;
}

/* Subtle paper noise */
.paper-noise {
  position: relative;
  isolation: isolate;
}
.paper-noise::before {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.55;
  mix-blend-mode: multiply;
  background-image:
    radial-gradient(rgba(26,23,19,0.025) 1px, transparent 1px);
  background-size: 3px 3px;
}
.paper-noise > * { position: relative; z-index: 1; }

/* Selection */
::selection { background: var(--accent); color: var(--paper-2); }

function SmartImage({ src, fallbackId, alt = '', aspect = '16 / 10', fit = 'cover', position = 'center top', radius = 'var(--r-lg)', onZoom = null }) {
  const [status, setStatus] = React.useState(src ? 'loading' : 'error');
  React.useEffect(() => {
    if (!src) { setStatus('error'); return; }
    setStatus('loading');
    let done = false;
    const im = new Image();
    const to = setTimeout(() => { if (!done) { done = true; setStatus('error'); } }, 9000);
    im.onload  = () => { if (!done) { done = true; clearTimeout(to); setStatus(im.naturalWidth > 0 ? 'ok' : 'error'); } };
    im.onerror = () => { if (!done) { done = true; clearTimeout(to); setStatus('error'); } };
    im.src = src;
    return () => { done = true; clearTimeout(to); };
  }, [src]);

  if (status !== 'ok') {
    if (fallbackId) return <ArtworkPlaceholder id={fallbackId} aspect={aspect} />;
    return <div style={{ width: '100%', aspectRatio: aspect, borderRadius: radius, background: 'var(--bone-2)', border: '1px solid var(--line)' }} />;
  }
  const clickable = typeof onZoom === 'function';
  return (
    <div
      onClick={clickable ? () => onZoom(src, alt) : undefined}
      style={{ width: '100%', aspectRatio: aspect, borderRadius: radius, overflow: 'hidden',
        background: 'var(--bone-2)', cursor: clickable ? 'zoom-in' : 'default' }}>
      <img src={src} alt={alt} style={{ width: '100%', height: '100%', objectFit: fit, objectPosition: position, display: 'block' }} />
    </div>
  );
}

/* Shared language state, persisted via localStorage, auto-detected from locale/timezone */
function usePortfolioLang() {
  const [lang, setLangState] = React.useState(() => {
    try {
      const saved = localStorage.getItem('pf-lang');
      if (saved === 'ru' || saved === 'en') return saved;
      const nav  = (navigator.language || navigator.userLanguage || '').toLowerCase();
      const langs = (navigator.languages || []).join(',').toLowerCase();
      const tz   = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
      const ruTz = /Moscow|Kaliningrad|Samara|Yekaterinburg|Volgograd|Saratov|Astrakhan|Ulyanovsk|Kirov|Omsk|Novosibirsk|Barnaul|Tomsk|Krasnoyarsk|Novokuznetsk|Irkutsk|Chita|Yakutsk|Khandyga|Vladivostok|Ust-Nera|Magadan|Sakhalin|Srednekolymsk|Kamchatka|Anadyr/i.test(tz);
      return (nav.startsWith('ru') || langs.includes('ru') || ruTz) ? 'ru' : 'en';
    } catch (e) { return 'en'; }
  });
  const setLang = React.useCallback((L) => {
    setLangState(L);
    try { localStorage.setItem('pf-lang', L); } catch (e) {}
  }, []);
  React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  return [lang, setLang];
}

const BOLD_RE = /(\b(?:Ant Design|Admiral|Shopify Polaris|Polaris|Storybook|RICE|CJM|JTBD|PDF Viewer|Meeting Flow|Jira|MAU|Information Architecture)\b|[−~]?\d[\d .,]*(?:%|\+|K|→\s?\d[\d.,]*[%+K]*|[–-]\d[\d.,]*[%+K]*)?(?:\s?(?:months?|mo|мес(?:яцев|яца)?|years?|yrs?|лет|года?|days?|ч|h))?)/g;
function boldify(text) {
  return String(text).split(BOLD_RE).map((p, i) =>
    i % 2 === 1
      ? <strong key={i} style={{ color: 'var(--ink)', fontWeight: 700 }}>{p}</strong>
      : p
  );
}

function useRotator(items, period = 2200) {
  const [i, setI] = React.useState(0);
  React.useEffect(() => {
    const t = setInterval(() => setI(x => (x + 1) % items.length), period);
    return () => clearInterval(t);
  }, [items.length, period]);
  return items[i];
}

/* Root */
function App() {
  const [lang, setLang] = usePortfolioLang();

  React.useEffect(() => {
    const KEY = 'pf-home-scroll';
    try {
      if (sessionStorage.getItem('pf-restore') === '1') {
        const y = parseInt(sessionStorage.getItem(KEY) || '0', 10);
        sessionStorage.removeItem('pf-restore');
        if (y > 0) {
          [0, 120, 360, 700].forEach(d => setTimeout(() => window.scrollTo(0, y), d));
        }
      }
    } catch (e) {}
    let raf;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => { try { sessionStorage.setItem(KEY, String(window.scrollY)); } catch (e) {} });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div style={{ background: 'var(--bone)', color: 'var(--ink)', minHeight: '100%' }}>
      <TopBar lang={lang} setLang={setLang}/>
      <Hero lang={lang}/>
      <AboutBand lang={lang}/>
      <Skills lang={lang}/>
      <Experience lang={lang}/>
      <Leadership lang={lang}/>
      <Portfolio lang={lang}/>
      <Contact lang={lang}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
